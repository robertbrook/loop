[package]
name = "loop-lisp"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
roxmltree = "0.21"
html5ever = "0.35"
markup5ever_rcdom = "0.35"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
getrandom = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loop"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
