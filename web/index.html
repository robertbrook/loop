<!doctype html>
<!-- Loop workbench: program and results, with examples available in a select.
Keep the cool-blue palette in both themes; omit promotional and tutorial copy. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2449ba">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Loop is a Lisp dialect implemented in Rust, running in your browser with WebAssembly. Write, run, and explore.">
  <title>Loop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232449ba'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='42' fill='white' font-family='monospace'%3E()%3C/text%3E%3C/svg%3E">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <h1>Loop</h1>
    <div class="runtime"><span id="status-dot" class="status-dot" aria-hidden="true"></span><span id="runtime-status" role="status">Loading…</span></div>
    <select id="theme" aria-label="Color theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <a href="https://github.com/robertbrook/loop#language" target="_blank" rel="noreferrer">Reference</a>
    <a href="https://github.com/robertbrook/loop" target="_blank" rel="noreferrer">Source</a>
  </header>
  <main>
    <div class="workbench">
      <section class="editor-panel" aria-labelledby="program-title">
        <div class="panel-toolbar">
          <h2 id="program-title">Program</h2>
          <button id="open-files" class="quiet" disabled>Open files</button>
          <input id="source-files" type="file" accept=".loop,.lisp,.scm,text/plain" multiple hidden>
          <select id="example-list" aria-label="Load example or source file"></select>
          <button id="run" class="primary" title="Run program (Ctrl/Cmd+Enter)" disabled>Run</button>
        </div>
        <div class="editor-wrap"><div id="line-numbers" aria-hidden="true">1</div><textarea id="editor" aria-label="Lisp program" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
      </section>
      <section class="results-panel" aria-labelledby="results-title">
        <div class="panel-toolbar"><h2 id="results-title">Result</h2><button id="reset" class="quiet" title="Clear results and definitions">Reset session</button></div>
        <div id="results" role="log" aria-label="Evaluation results" aria-live="polite" aria-relevant="additions"></div>
        <form id="repl-form"><label for="repl">REPL</label><div class="repl-input"><span aria-hidden="true">λ</span><input id="repl" placeholder="(+ 1 2)" spellcheck="false" autocomplete="off" aria-label="REPL expression"><button id="repl-run" type="submit" disabled aria-label="Evaluate expression">↵</button></div></form>
      </section>
    </div>
  </main>
  <noscript>Loop needs JavaScript and WebAssembly enabled to run the Lisp interpreter.</noscript>
</body>
</html>
